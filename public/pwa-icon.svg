<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1E"/>
      <stop offset="50%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>

    <!-- Vibrant Balaji Saffron Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="45%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#E64A00"/>
    </linearGradient>

    <!-- Premium Steel Metallic Gradient for Tools -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Orange Radial Aura Glow -->
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- 100% Full-Bleed Dark Background (No rounded corners on outer SVG, so phone launcher clips smoothly) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Center Soft Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#orangeGlow)"/>

  <!-- PROMINENT & ZOOMED-IN HARDWARE EMBLEM (Scaled up to fill 85% of canvas) -->
  <g transform="translate(256, 256)" filter="url(#shadow)">

    <!-- Outer Industrial Gear Ring (Radius 205) -->
    <g fill="url(#orangeGrad)">
      <circle r="195" fill="none" stroke="url(#orangeGrad)" stroke-width="20"/>
      
      <!-- 8 Outer Heavy Industrial Teeth -->
      <rect x="-22" y="-228" width="44" height="34" rx="8"/>
      <rect x="-22" y="194" width="44" height="34" rx="8"/>
      <rect x="-228" y="-22" width="34" height="44" rx="8"/>
      <rect x="194" y="-22" width="34" height="44" rx="8"/>

      <rect x="-22" y="-228" width="44" height="34" rx="8" transform="rotate(45)"/>
      <rect x="-22" y="-228" width="44" height="34" rx="8" transform="rotate(135)"/>
      <rect x="-22" y="-228" width="44" height="34" rx="8" transform="rotate(225)"/>
      <rect x="-22" y="-228" width="44" height="34" rx="8" transform="rotate(315)"/>
    </g>

    <!-- Inner Dark Core Circle for Extreme Contrast -->
    <circle r="170" fill="#0F0F12" stroke="url(#orangeGrad)" stroke-width="6"/>

    <!-- Hardware Roof Outline -->
    <path d="M 0 -115 L 115 -15 L 90 -15 L 90 90 L -90 90 L -90 -15 L -115 -15 Z" fill="none" stroke="url(#orangeGrad)" stroke-width="12" stroke-linejoin="round" opacity="0.45"/>

    <!-- LARGE ZOOMED CROSSED HARDWARE TOOLS -->
    
    <!-- Tool 1: Heavy Duty Spanner / Wrench (Rotated -35 deg) -->
    <g transform="rotate(-35) scale(1.35)">
      <!-- Shaft -->
      <rect x="-10" y="-65" width="20" height="120" rx="6" fill="url(#steelGrad)"/>
      <!-- Open Head Top -->
      <path d="M -22 -58 C -28 -78 -7 -92 0 -92 C 7 -92 28 -78 22 -58 C 14 -50 12 -42 0 -42 C -12 -42 -14 -50 -22 -58 Z" fill="url(#steelGrad)"/>
      <circle cx="0" cy="-68" r="10" fill="#0F0F12"/>
      <!-- Ring Head Bottom -->
      <circle cx="0" cy="52" r="18" fill="url(#steelGrad)"/>
      <circle cx="0" cy="52" r="10" fill="#0F0F12"/>
    </g>

    <!-- Tool 2: Heavy Duty Claw Hammer (Rotated +35 deg) -->
    <g transform="rotate(35) scale(1.35)">
      <!-- Orange Grip Handle -->
      <rect x="-9" y="-25" width="18" height="95" rx="5" fill="url(#orangeGrad)"/>
      <!-- Steel Hammer Head -->
      <path d="M -40 -54 L 22 -54 L 30 -50 L 30 -32 L 22 -28 L -14 -28 L -30 -22 C -40 -22 -45 -32 -40 -54 Z" fill="url(#steelGrad)"/>
      <!-- Claw Curved Tail -->
      <path d="M -14 -54 C -28 -68 -42 -62 -50 -48 C -40 -40 -28 -40 -14 -40 Z" fill="url(#steelGrad)"/>
    </g>

    <!-- Center Industrial Hex Nut Accent -->
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="url(#orangeGrad)"/>
    <circle cx="0" cy="0" r="11" fill="#0F0F12"/>

  </g>
</svg>
