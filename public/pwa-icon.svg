<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#D94600"/>
    </linearGradient>
    <clipPath id="circleClip">
      <rect width="512" height="512" rx="100"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="url(#orangeGrad)" stroke-width="12"/>

  <!-- Hanuman Ji Picture -->
  <g clip-path="url(#circleClip)">
    <image href="https://res.cloudinary.com/pqs85ndb/image/upload/v1785676217/IMG-20260802-WA0004_pvecpl.jpg" x="20" y="20" width="472" height="472" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- Outer Protective Border -->
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#FF6B00" stroke-width="8" opacity="0.8"/>
</svg>
