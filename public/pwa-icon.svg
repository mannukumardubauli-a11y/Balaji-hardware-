<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#D94600"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Border -->
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="url(#orangeGrad)" stroke-width="8" opacity="0.8"/>
  <rect x="28" y="28" width="456" height="456" rx="76" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Center Shield Badge -->
  <path d="M256 70 L390 120 V250 C390 350 256 430 256 430 C256 430 122 350 122 250 V120 Z" 
        fill="#121215" stroke="url(#orangeGrad)" stroke-width="12" filter="url(#glow)"/>

  <!-- Inner Metallic Emblem -->
  <path d="M256 90 L370 132 V242 C370 330 256 400 256 400 C256 400 142 330 142 242 V132 Z" 
        fill="url(#bgGrad)" stroke="#27272a" stroke-width="4"/>

  <!-- Hardware Symbols Cross: Hammer & Wrench -->
  <!-- Hammer -->
  <g transform="translate(256, 250) rotate(-45) translate(-256, -250)">
    <!-- Handle -->
    <rect x="246" y="210" width="20" height="130" rx="6" fill="url(#orangeGrad)"/>
    <!-- Head -->
    <path d="M216 190 H296 V210 H216 Z" fill="#e4e4e7"/>
    <path d="M280 170 H296 V210 H280 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Wrench -->
  <g transform="translate(256, 250) rotate(45) translate(-256, -250)">
    <!-- Handle -->
    <rect x="246" y="200" width="20" height="130" rx="6" fill="#71717a"/>
    <!-- Jaw Top -->
    <path d="M236 170 C236 150 276 150 276 170 V190 H236 Z" fill="#e4e4e7"/>
    <circle cx="256" cy="170" r="12" fill="#18181b"/>
  </g>

  <!-- Stylized "B" for Balaji in center -->
  <circle cx="256" cy="250" r="46" fill="url(#orangeGrad)" stroke="#ffffff" stroke-width="4"/>
  <text x="256" y="268" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle">B</text>

  <!-- Bottom Brand Text -->
  <text x="256" y="468" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="30" fill="#ffffff" letter-spacing="2" text-anchor="middle">BALAJI HARDWARE</text>
</svg>
