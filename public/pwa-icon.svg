<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Solid Black Background -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Centered Orange Saffron Hanuman Ji Silhouette -->
  <g transform="translate(40, 20) scale(2.1)">
    <!-- Saffron Orange Silhouette Paths matching the iconic artwork -->
    <g fill="#FF5500">
      <!-- U-Shaped Tilak on Forehead -->
      <path d="M 90 22 C 90 10 108 10 108 22 L 108 68 C 108 80 90 80 90 68 Z" />
      <!-- Black Center Line inside Tilak -->
      <path d="M 95 26 L 103 26 L 103 64 L 95 64 Z" fill="#000000" />
      <!-- Red/Orange Dot below Tilak -->
      <circle cx="99" cy="73" r="4.5" fill="#FF5500" />

      <!-- Angry Eyebrows -->
      <path d="M 52 66 C 75 54 88 65 95 72 C 86 75 68 70 52 66 Z" />
      <path d="M 148 66 C 125 54 112 65 105 72 C 114 75 132 70 148 66 Z" />

      <!-- Piercing Eye with Pupil cutout -->
      <path d="M 106 78 C 120 72 136 78 144 85 C 130 92 114 90 106 78 Z" />
      <circle cx="123" cy="83" r="3.5" fill="#000000" />

      <!-- Nose Bridge and Muzzle -->
      <path d="M 94 74 C 95 87 91 103 82 116 C 94 114 110 112 119 105 C 108 96 100 86 94 74 Z" />

      <!-- Mouth & Jawline -->
      <path d="M 64 111 C 76 117 98 122 114 117 C 108 125 88 132 72 127 C 62 122 60 116 64 111 Z" />

      <!-- Ear & Kundal Ring -->
      <path d="M 145 85 C 160 88 166 104 156 115 C 148 112 145 98 145 85 Z" />
      <path d="M 155 108 C 167 113 167 130 153 132 C 146 125 148 114 155 108 Z" fill="none" stroke="#FF5500" stroke-width="5" />

      <!-- Flowing Hair / Mane -->
      <path d="M 136 44 C 160 38 182 55 188 76 C 175 74 162 65 150 63 C 162 76 174 91 190 107 C 175 104 162 96 154 88 Z" />
      <path d="M 156 116 C 174 127 190 148 180 170 C 171 153 162 137 149 128 Z" />

      <!-- Muscular Neck & Chest -->
      <path d="M 72 131 C 84 152 100 178 128 198 C 106 192 84 171 62 145 C 56 135 65 131 72 131 Z" />
      <path d="M 114 134 C 130 152 152 176 170 193 C 152 185 135 166 121 148 Z" />
    </g>
  </g>
</svg>
