<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Full bleed dark canvas) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1E"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </linearGradient>

    <!-- Vibrant Orange Saffron Brand Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E00"/>
      <stop offset="50%" stop-color="#FF6200"/>
      <stop offset="100%" stop-color="#E64A00"/>
    </linearGradient>

    <!-- Crisp White/Silver Gradient for Metal Tools -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Icon Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Full Bleed Background (Ensures zero edge clipping issues on Android/iOS masks) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Centered Safe-Zone Emblem Container (Radius 135px -> completely inside the 66% Android mask) -->
  <g transform="translate(256, 256)" filter="url(#dropShadow)">
    
    <!-- Bold Orange Shield / Circle Container -->
    <circle r="135" fill="url(#orangeGrad)"/>
    
    <!-- Subtle Inner Ring Accent -->
    <circle r="120" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.25"/>

    <!-- CLEAN & SIMPLE HARDWARE SYMBOL (Crossed Hammer + Wrench inside safe zone) -->
    
    <!-- Tool 1: Wrench (Rotated -35 deg) -->
    <g transform="rotate(-35)">
      <!-- Shaft -->
      <rect x="-9" y="-60" width="18" height="110" rx="5" fill="url(#silverGrad)"/>
      <!-- Open End Head Top -->
      <path d="M -20 -52 C -26 -70 -6 -82 0 -82 C 6 -82 26 -70 20 -52 C 12 -45 10 -38 0 -38 C -10 -38 -12 -45 -20 -52 Z" fill="url(#silverGrad)"/>
      <circle cx="0" cy="-60" r="9" fill="#FF6200"/>
      <!-- Ring End Bottom -->
      <circle cx="0" cy="50" r="16" fill="url(#silverGrad)"/>
      <circle cx="0" cy="50" r="9" fill="#FF6200"/>
    </g>

    <!-- Tool 2: Heavy Duty Claw Hammer (Rotated +35 deg) -->
    <g transform="rotate(35)">
      <!-- Handle -->
      <rect x="-8" y="-22" width="16" height="85" rx="4" fill="#1A1A1E"/>
      <!-- Steel Head -->
      <path d="M -36 -48 L 18 -48 L 26 -44 L 26 -28 L 18 -24 L -12 -24 L -26 -20 C -36 -20 -40 -28 -36 -48 Z" fill="url(#silverGrad)"/>
      <!-- Claw Curved Back -->
      <path d="M -12 -48 C -24 -60 -36 -56 -42 -44 C -34 -36 -24 -36 -12 -36 Z" fill="url(#silverGrad)"/>
    </g>

    <!-- Center Bolt Accent for Hardware Polish -->
    <circle cx="0" cy="0" r="14" fill="#1A1A1E"/>
    <polygon points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4" fill="url(#silverGrad)"/>

  </g>
</svg>
