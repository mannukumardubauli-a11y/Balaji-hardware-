<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181C"/>
      <stop offset="50%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>

    <!-- Vibrant Saffron/Orange Brand Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9100"/>
      <stop offset="50%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#D50000"/>
    </linearGradient>

    <!-- Metallic Steel Gradient for Tool Heads -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Glow effect behind emblem -->
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 100% Full-bleed background (No rounded corners, so launcher clips seamlessly) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Soft Center Glow Aura -->
  <circle cx="256" cy="256" r="180" fill="url(#orangeGlow)"/>

  <!-- Main Hardware emblem - Centered within 300x300 safe area (r <= 150) -->
  <g transform="translate(256, 256)" filter="url(#shadow)">

    <!-- Industrial Outer Gear (Radius ~140, well within safe circle) -->
    <g fill="url(#orangeGrad)">
      <circle r="128" fill="none" stroke="url(#orangeGrad)" stroke-width="14"/>
      
      <!-- 8 Outer Gear Teeth -->
      <rect x="-14" y="-150" width="28" height="24" rx="5"/>
      <rect x="-14" y="126" width="28" height="24" rx="5"/>
      <rect x="-150" y="-14" width="24" height="28" rx="5"/>
      <rect x="126" y="-14" width="24" height="28" rx="5"/>

      <rect x="-14" y="-150" width="28" height="24" rx="5" transform="rotate(45)"/>
      <rect x="-14" y="-150" width="28" height="24" rx="5" transform="rotate(135)"/>
      <rect x="-14" y="-150" width="28" height="24" rx="5" transform="rotate(225)"/>
      <rect x="-14" y="-150" width="28" height="24" rx="5" transform="rotate(315)"/>
    </g>

    <!-- Inner Dark Circle for maximum contrast -->
    <circle r="110" fill="#0F0F12" stroke="url(#orangeGrad)" stroke-width="4"/>

    <!-- Hardware Roof Outline for Store Identity -->
    <path d="M 0 -75 L 75 -10 L 58 -10 L 58 60 L -58 60 L -58 -10 L -75 -10 Z" fill="none" stroke="url(#orangeGrad)" stroke-width="8" stroke-linejoin="round" opacity="0.4"/>

    <!-- CROSSED TOOLS (Scaled & Fitted inside r=100 safe space) -->
    
    <!-- Tool 1: Adjustable Wrench / Spanner (Rotated -35 deg) -->
    <g transform="rotate(-35)">
      <!-- Wrench Handle -->
      <rect x="-9" y="-60" width="18" height="115" rx="5" fill="url(#steelGrad)"/>
      <!-- Wrench Head Top -->
      <path d="M -20 -55 C -26 -72 -8 -85 0 -85 C 8 -85 26 -72 20 -55 C 13 -48 11 -40 0 -40 C -11 -40 -13 -48 -20 -55 Z" fill="url(#steelGrad)"/>
      <circle cx="0" cy="-64" r="9" fill="#0F0F12"/>
      <rect x="-6" y="-80" width="12" height="20" fill="#0F0F12"/>
      <!-- Ring End Bottom -->
      <circle cx="0" cy="55" r="17" fill="url(#steelGrad)"/>
      <circle cx="0" cy="55" r="9" fill="#0F0F12"/>
    </g>

    <!-- Tool 2: Heavy Duty Hammer (Rotated +35 deg) -->
    <g transform="rotate(35)">
      <!-- Orange Handle -->
      <rect x="-8" y="-25" width="16" height="90" rx="4" fill="url(#orangeGrad)"/>
      <!-- Steel Hammer Head -->
      <path d="M -38 -52 L 20 -52 L 28 -48 L 28 -32 L 20 -28 L -12 -28 L -28 -24 C -38 -24 -42 -32 -38 -52 Z" fill="url(#steelGrad)"/>
      <!-- Claw Curved Tail -->
      <path d="M -12 -52 C -24 -64 -36 -60 -44 -48 C -36 -40 -24 -40 -12 -40 Z" fill="url(#steelGrad)"/>
    </g>

    <!-- Center Industrial Hex Nut Accent -->
    <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="url(#orangeGrad)"/>
    <circle cx="0" cy="0" r="8" fill="#0F0F12"/>

  </g>
</svg>
