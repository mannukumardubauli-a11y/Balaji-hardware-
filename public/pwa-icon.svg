<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C21"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- Outer Accent Border -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="url(#orangeGrad)" stroke-width="10" stroke-opacity="0.8"/>

  <!-- Hardware Emblem Container -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    
    <!-- Outer Gear Wheel (Industrial Hardware) -->
    <g fill="url(#orangeGrad)">
      <circle r="165" fill="none" stroke="url(#orangeGrad)" stroke-width="12" opacity="0.35"/>
      
      <!-- Industrial Gear Teeth -->
      <rect x="-18" y="-190" width="36" height="30" rx="6"/>
      <rect x="-18" y="160" width="36" height="30" rx="6"/>
      <rect x="-190" y="-18" width="30" height="36" rx="6"/>
      <rect x="160" y="-18" width="30" height="36" rx="6"/>
      
      <rect x="-18" y="-190" width="36" height="30" rx="6" transform="rotate(45)"/>
      <rect x="-18" y="-190" width="36" height="30" rx="6" transform="rotate(135)"/>
      <rect x="-18" y="-190" width="36" height="30" rx="6" transform="rotate(225)"/>
      <rect x="-18" y="-190" width="36" height="30" rx="6" transform="rotate(315)"/>
    </g>

    <!-- Inner Dark Circle Background -->
    <circle r="140" fill="#121215" stroke="url(#orangeGrad)" stroke-width="8"/>

    <!-- Building / House Roof (Hardware & Construction Symbol) -->
    <path d="M 0 -100 L 110 -10 L 82 -10 L 82 80 L -82 80 L -82 -10 L -110 -10 Z" fill="none" stroke="url(#orangeGrad)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Crossed Tools: Hammer & Wrench -->
    <!-- Wrench (Rotated -30 deg) -->
    <g transform="rotate(-30) scale(1.05)">
      <!-- Wrench Shaft -->
      <rect x="-10" y="-75" width="20" height="145" rx="6" fill="url(#silverGrad)"/>
      <!-- Open End Head Top -->
      <path d="M -24 -70 C -32 -90 -10 -105 0 -105 C 10 -105 32 -90 24 -70 C 16 -60 14 -50 0 -50 C -14 -50 -16 -60 -24 -70 Z" fill="url(#silverGrad)"/>
      <circle cx="0" cy="-80" r="12" fill="#121215"/>
      <rect x="-8" y="-100" width="16" height="25" fill="#121215"/>
      <!-- Ring End Head Bottom -->
      <circle cx="0" cy="70" r="22" fill="url(#silverGrad)"/>
      <circle cx="0" cy="70" r="12" fill="#121215"/>
    </g>

    <!-- Claw Hammer (Rotated +30 deg) -->
    <g transform="rotate(30) scale(1.05)">
      <!-- Wooden/Orange Handle -->
      <rect x="-9" y="-35" width="18" height="115" rx="5" fill="url(#orangeGrad)"/>
      <!-- Hammer Head (Metal) -->
      <path d="M -45 -65 L 25 -65 L 35 -60 L 35 -40 L 25 -35 L -15 -35 L -35 -30 C -45 -30 -50 -40 -45 -65 Z" fill="url(#silverGrad)"/>
      <!-- Claw Curved Tail -->
      <path d="M -15 -65 C -30 -80 -45 -75 -55 -60 C -45 -50 -30 -50 -15 -50 Z" fill="url(#silverGrad)"/>
    </g>

    <!-- Center Hex Nut Accent -->
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="url(#orangeGrad)"/>
    <circle cx="0" cy="0" r="10" fill="#121215"/>

  </g>
</svg>
